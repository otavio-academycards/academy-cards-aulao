<!DOCTYPE html>
<!--
  Fonte da assets/img/og-image.jpg (1200x630). Não é publicada (deploy.sh só
  sobe index.html, obrigado e assets/). Para regerar: abrir esta página pelo
  servidor local (python -m http.server na pasta do aulão, /tools/og-image.html)
  numa janela de 1200x630 e salvar a captura como JPEG em assets/img/og-image.jpg.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OG aulão</title>
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Nunito", sans-serif;
    background: #001a27;
    color: #f3fbff;
    position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(50% 60% at 82% 30%, rgb(63 191 255 / 0.28), transparent 70%),
      radial-gradient(40% 50% at 0% 100%, rgb(255 168 88 / 0.14), transparent 70%),
      radial-gradient(circle at 1px 1px, rgb(147 219 255 / 0.18) 1px, transparent 1.6px) 0 0 / 24px 24px;
  }
  .left { position: absolute; left: 72px; top: 64px; width: 640px; }
  .logo { display: block; width: 220px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 44px; padding: 8px 16px;
    border-radius: 999px; background: rgb(63 191 255 / 0.14);
    color: #93dbff; font-size: 20px; font-weight: 800;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #ff5a5a; }
  h1 {
    margin-top: 20px;
    font-size: 68px; font-weight: 800; line-height: 1.02; letter-spacing: -0.035em;
  }
  h1 em {
    font-style: normal; color: #3fbfff;
    background: linear-gradient(#ffe86d, #ffe86d) no-repeat left bottom / 100% 0.1em;
    padding-bottom: 0.04em;
  }
  .when { display: flex; align-items: center; gap: 20px; margin-top: 34px; }
  .cal {
    width: 84px; border-radius: 14px; overflow: hidden; background: #fff; color: #001a27;
    text-align: center; rotate: -5deg; box-shadow: 0 14px 28px -12px rgb(0 0 0 / 0.6);
  }
  .cal b { display: block; background: #ffa858; font-size: 14px; letter-spacing: 0.14em; padding: 4px 0 3px; }
  .cal strong { display: block; font-size: 40px; line-height: 1.05; }
  .cal span { display: block; font-size: 13px; font-weight: 800; letter-spacing: 0.1em; padding-bottom: 6px; color: #3d4a55; }
  .when p { font-size: 28px; font-weight: 800; line-height: 1.2; }
  .when small { display: block; font-size: 21px; font-weight: 600; color: rgb(231 247 255 / 0.75); }

  .stack { position: absolute; right: 84px; top: 150px; width: 300px; height: 380px; }
  .c { position: absolute; inset: 0; border-radius: 28px; box-shadow: 0 30px 60px -24px rgb(0 0 0 / 0.6); }
  .c1 { background: #ffa858; rotate: -9deg; translate: -40px 14px; }
  .c2 { background: #ffe86d; rotate: 8deg; translate: 40px 6px; }
  .c3 {
    background: #3fbfff; color: #001a27; padding: 30px 28px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .c3 small { font-size: 16px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
  .c3 p { margin-top: 8px; font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  .axel { position: absolute; right: 40px; top: -122px; width: 160px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="left">
    <img class="logo" src="../assets/img/academy-bone.svg" alt="">
    <p class="pill"><span class="dot"></span>Aulão gratuito e ao vivo</p>
    <h1>Você estuda e esquece? <em>A revisão,<br>o app organiza.</em></h1>
    <div class="when">
      <div class="cal"><b>NOV</b><strong>16</strong><span>SEG</span></div>
      <p>Segunda, 16/11, às 18h<small>Ao vivo pelo Google Meet</small></p>
    </div>
  </div>
  <div class="stack">
    <div class="c c1"></div>
    <div class="c c2"></div>
    <img class="axel" src="../assets/img/axel-acenando.svg" alt="">
    <div class="c c3"><small>No aulão</small><p>O que revisar e quando, na Revisão do Dia</p></div>
  </div>
</body>
</html>
